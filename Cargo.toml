[workspace]
resolver = "2"
members = [
    "crates/rp-proto",
    "crates/rp-wasm-patcher",
    "crates/rp-js-runtime",
    "crates/rp-server",
    "crates/rp-client-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boa_engine = "0.20"
wasmparser = "0.258.3"
wasm-encoder = { version = "0.258.3", features = ["wasmparser"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
