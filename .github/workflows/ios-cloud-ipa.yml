name: Build IndoCross RP iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      optimize_wasm:
        description: "Jalankan wasm-opt -O3 (lebih kencang FPS di iPhone, waktu build +4 menit)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ios-ipa:
    name: Build iPhone 15 (.ipa) Zero-Extract Client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Latest Xcode & Verify iOS SDK
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          if ! xcodebuild -showsdks 2>/dev/null | grep -q iphoneos; then
            xcodebuild -downloadPlatform iOS
          fi
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode/ {split($2, v, "."); print v[1]}')"
          if [ "${XCODE_MAJOR:-0}" -lt 26 ]; then
            sed -i '' '/muguet\.icon/d' client/ios/project.yml
          fi

      - name: Install Build Dependencies (xcodegen, cmake)
        env:
          OPT_WASM: ${{ inputs.optimize_wasm }}
        run: |
          PKGS=""
          command -v cmake >/dev/null || PKGS="$PKGS cmake"
          command -v xcodegen >/dev/null || PKGS="$PKGS xcodegen"
          if [ "$OPT_WASM" = "true" ]; then
            command -v wasm-opt >/dev/null || PKGS="$PKGS binaryen"
          fi
          if [ -n "$PKGS" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install $PKGS
          fi

      - name: Install Rust Toolchains (stable host + 1.98.1 iOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Upstream-Verified iOS Rust 1.98.1 Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            client -> client/target

      - name: Build iPhone 15 Sideload .ipa & Push to Private Sync Server
        env:
          RP_SERVER_HOST: ${{ secrets.RP_SERVER_HOST }}
          RP_SYNC_TOKEN: ${{ secrets.RP_SYNC_TOKEN }}
          RP_DEFAULT_SERVER: ${{ secrets.RP_SERVER_HOST }}
          RP_DEFAULT_SYNC_TOKEN: ${{ secrets.RP_SYNC_TOKEN }}
          BUNDLE_ID: "id.indocross.rp.ios"
          TOOLCHAIN: "1.98.1"
        run: |
          set -euo pipefail
          if [ -z "$RP_SERVER_HOST" ] || [ -z "$RP_SYNC_TOKEN" ]; then
            echo "RP_SERVER_HOST / RP_SYNC_TOKEN belum diset; skip build .ipa."
            exit 0
          fi

          SYNC_BASE="http://${RP_SERVER_HOST}:47521"
          curl -fsSL -H "X-RP-Sync-Token: ${RP_SYNC_TOKEN}" "${SYNC_BASE}/sync-index.json" -o /tmp/sync-index.json
          WASM_REL="$(python3 -c 'import json; d=json.load(open("/tmp/sync-index.json")); print(next(f["path"] for f in d["files"] if f["path"].endswith("/game.wasm")))')"
          rm -f /tmp/sync-index.json

          echo "Fetching user's private Wasm module (${WASM_REL}) into ephemeral RAM..."
          curl -fsSL -H "X-RP-Sync-Token: ${RP_SYNC_TOKEN}" "${SYNC_BASE}/files/${WASM_REL}" -o /tmp/input_game.wasm

          python3 -c 'import re; wasm = open("/tmp/input_game.wasm", "rb").read(); raw = [m.decode("ascii", "ignore").replace("\\", "/").replace("platform:", "x64").replace("common:", "common").lstrip("/") for m in re.findall(rb"[A-Za-z0-9_./:\\-]{3,120}\.rpf", wasm)]; found = {s.replace("//", "/") for s in raw if s.startswith(("x64/", "common/", "dlcpacks/", "levels/", "sfx/", "anim/", "audio/")) and "%" not in s}; found |= {"x64/" + s for s in list(found) if s.startswith(("sfx/", "audio/", "anim/", "levels/"))}; print(f"[wasm-scan] discovered {len(found)} .rpf path literals in game.wasm"); io_rs = open("client/src/io.rs").read(); extra = "\n".join(f"    \"{p}\"," for p in sorted(found) if f"\"{p}\"" not in io_rs); open("client/src/io.rs", "w").write(io_rs.replace("const VIRTUAL_STUB_RPFS: &[&str] = &[", "const VIRTUAL_STUB_RPFS: &[&str] = &[\n" + extra, 1)) if extra else None'

          cd client
          ./make-ios.sh /tmp/input_game.wasm --ipa
          rm -f /tmp/input_game.wasm

          python3 -c 'import struct; data = open("target/ios-xcode/Build/Products/Release-iphoneos/Muguet.app/muguet", "rb").read(); idx = data.rfind(b"\xfa\xde\x0c\x02"); eb, el, ef = struct.unpack(">QQQ", data[idx+64:idx+88]); print(f"[verify] Mach-O CodeDirectory execSegBase=0x{eb:x} execSegLimit=0x{el:x} ({el/1048576:.1f} MiB) flags=0x{ef:x}"); assert el > 100 * 1024 * 1024, f"execSegLimit too small: {el}"'

          echo "Uploading signed IndoCrossRP.ipa to private sync server..."
          curl -fsSL -X PUT -H "Expect:" -H "X-RP-Sync-Token: ${RP_SYNC_TOKEN}" \
            --upload-file build/IndoCrossRP.ipa "${SYNC_BASE}/client/IndoCrossRP.ipa"

          rm -rf build/IndoCrossRP.ipa target/ios-game target/ios target/ios-xcode
          echo "=== Cloud iOS .ipa Build Selesai & Tersimpan Privat! ==="
