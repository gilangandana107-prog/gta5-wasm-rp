name: Cloud Lite Asset Trimmer (-> Private Cloud / Google Drive)

# Workflow manual 1-klik (Stateless Worker) untuk memangkas arsip Wasm ~20 GB milik pengguna sendiri
# menjadi paket Sandbox/RP Lite ~10-11 GB lalu mengunggahnya ke Google Drive pribadi pengguna via rclone.
# Repo tetap 100% bersih tanpa URL hardcoded maupun aset berhak cipta.
on:
  workflow_dispatch:
    inputs:
      output_filename:
        description: "Nama file output di Google Drive kamu"
        required: true
        default: "game-rp-lite.zip"
        type: string
      gdrive_folder:
        description: "Nama folder tujuan di Google Drive"
        required: true
        default: "RP-Lite-Build"
        type: string
      patch_wasm:
        description: "Sekalian suntik hook Roleplay & Movie Stub ke game.wasm?"
        required: true
        default: true
        type: boolean
      analyze_only:
        description: "Hanya cek rincian penghematan GB tanpa membuat ZIP baru?"
        required: true
        default: false
        type: boolean

jobs:
  trim-and-upload:
    name: Trim Archive & Upload to Google Drive
    runs-on: ubuntu-latest
    steps:
      - name: Free Up Runner Disk Space (~60 GB Free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Build rp-lite-trimmer
        run: cargo build --release -p rp-lite-trimmer

      - name: Download, Trim, and Upload via Rclone
        env:
          SOURCE_ZIP_URL: ${{ secrets.SOURCE_ZIP_URL }}
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          OUT_NAME: ${{ inputs.output_filename }}
          GDRIVE_DIR: ${{ inputs.gdrive_folder }}
          PATCH_WASM: ${{ inputs.patch_wasm }}
          ANALYZE_ONLY: ${{ inputs.analyze_only }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_ZIP_URL" ]; then
            echo "::error::Secret SOURCE_ZIP_URL belum diisi di Settings -> Secrets and variables -> Actions!"
            exit 1
          fi

          mkdir -p /mnt/tmp-rp
          echo "[1/3] Mengunduh arsip sumber ke ruang kerja sementara..."
          curl -fL --retry 3 -o /mnt/tmp-rp/source.zip "$SOURCE_ZIP_URL"

          if [ "$ANALYZE_ONLY" = "true" ]; then
            ./target/release/rp-lite-trimmer --analyze /mnt/tmp-rp/source.zip
            rm -rf /mnt/tmp-rp
            exit 0
          fi

          echo "[2/3] Memangkas aset Story/Radio/Bink secara streaming ke ZIP64 Lite..."
          EXTRA_FLAG=""
          if [ "$PATCH_WASM" = "true" ]; then
            EXTRA_FLAG="--patch-wasm"
          fi
          ./target/release/rp-lite-trimmer --repack /mnt/tmp-rp/source.zip "/mnt/tmp-rp/$OUT_NAME" $EXTRA_FLAG
          rm -f /mnt/tmp-rp/source.zip
          ls -lh "/mnt/tmp-rp/$OUT_NAME"

          if [ -z "$RCLONE_CONFIG_DATA" ]; then
            echo "::warning::Secret RCLONE_CONFIG belum diatur; melewati langkah upload ke Google Drive."
            rm -rf /mnt/tmp-rp
            exit 0
          fi

          echo "[3/3] Mengunggah $OUT_NAME ke Google Drive (gdrive:$GDRIVE_DIR)..."
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          rclone copy "/mnt/tmp-rp/$OUT_NAME" "gdrive:$GDRIVE_DIR" --progress --stats=10s
          rm -rf /mnt/tmp-rp ~/.config/rclone/rclone.conf
          echo "Selesai! File $OUT_NAME sudah tersimpan di Google Drive folder '$GDRIVE_DIR'."
